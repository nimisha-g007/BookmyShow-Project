{% extends 'website/base.html' %}
{% block title %}Login | CineBook{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="auth-card">
        <p class="eyebrow pink">WELCOME BACK</p>
        <h1>Sign in</h1><p class="auth-subtitle">Log in to continue to CineBook.</p>
        <form method="post">{% csrf_token %}
            <label>Username</label><input type="text" name="username" required><label>Password</label>
            <input type="password" name="password" required>
            <button class="primary-button full-button" type="submit">Sign in</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
        </p>
    </div>
</section>
{% endblock %}
